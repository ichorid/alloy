[project]
name = "alloy"
version = "0.1.0"
description = "Local-first orchestration for durable, adaptive coding-agent workflows"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "textual>=1.0",
]

[project.scripts]
alloy = "alloy.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-xdist>=3.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alloy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Run in parallel by default (pytest-xdist). Use `pytest -n 0` or `pytest -p no:xdist` for a serial run.
addopts = ["-n", "auto"]
# The checkout being tested must be the one imported. The venv's editable
# install points at the main checkout, so inside an Alloy worktree a bare
# `import alloy` would test main's code; this puts ./src ahead of it.
pythonpath = ["src"]

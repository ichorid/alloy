name: fast-track
roles:
  implement:
    runner: codex
    model: gpt-6.1-sol
    timeout_minutes: 25
    fallback:
      runner: claude-write
      model: sonnet
      timeout_minutes: 25
      fallback:
        runner: cursor
        model: composer-2.5
        timeout_minutes: 25
  harvest: {runner: claude, model: sonnet}
verification:
  max_checks_per_iteration: 5
  max_total_checks: 15
  max_command_timeout_minutes: 15
limits:
  max_iterations: 4
  max_consiliums: 0
  max_wall_time_minutes: 45
  max_agent_calls: 10

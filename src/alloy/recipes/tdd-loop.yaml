name: tdd-loop

complexity:
  routing: shadow  # shadow keeps role runners; live selects tiers for tiered roles
  escalate_after_retries: 2
  # A tier is a priority-ordered runner list: the first is primary, the rest fallbacks.
  tiers:
    simple:
      - {runner: cursor, model: composer-2.5}
      - {runner: codex, model: gpt-5.6-luna}
      - {runner: claude-write, model: haiku}
    medium:
      - {runner: claude-write, model: sonnet}
      - {runner: cursor, model: composer-2.5}
    complex:
      - {runner: astra}
      - {runner: claude-write, model: fable}
      - {runner: cursor, model: kimi-k3-high}
      - {runner: claude-write, model: opus}

roles:
  context:
    runner: cursor-plan          # read-only: gathers understanding, changes nothing
    timeout_minutes: 10

  tests:
    # Pinned because tests are the spec the judge enforces; composer-2.5 is non-fast.
    runner: cursor
    model: composer-2.5
    timeout_minutes: 20
    fallback:
      runner: claude-write
      model: sonnet
      timeout_minutes: 20

  implement:
    tiered: true
    runner: astra                # aliases to codex; override under `runners:` to swap
    timeout_minutes: 25
    fallback:                    # when codex is missing, rate-limited or times out
      runner: claude-write
      model: fable               # Claude Fable 5.1 (alias resolves to claude-fable-5-1)
      timeout_minutes: 25

  judge:
    runner: claude
    model: sonnet
    timeout_minutes: 10

consilium:
  critics:
    - runner: claude
      model: sonnet
    - runner: codex-readonly
    - runner: pi                 # skipped automatically when the CLI is absent
  synthesizer:
    runner: claude
    model: sonnet

verify:
  timeout_minutes: 15
  # command: python -m pytest -q   # otherwise autodetected, or set alloy_test_cmd on the bead

limits:
  max_iterations: 5
  max_consiliums: 1
  max_wall_time_minutes: 90
  max_agent_calls: 20

on_success_status: review-ready
cleanup_worktree_on_success: false
